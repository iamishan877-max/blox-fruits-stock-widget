<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blox Fruits Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    background: transparent;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px;
  }

  #blox-stock {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 20px;
    box-sizing: border-box;
  }

  /* Tabs */
  .stock-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stock-tabs button {
    flex: 1;
    padding: 10px 0;
    font-size: 16px;
    border: 1px solid #ccc;
    background: #f7f7f7;
    cursor: pointer;
    border-radius: 8px;
  }

  .stock-tabs button.active {
    font-weight: 600;
    background: #eaeaea;
  }

  /* Timer */
  #stock-timer {
    font-size: 15px;
    margin-bottom: 16px;
    color: #222;
    text-align: center;
  }

  /* List */
  #stock-list {
    list-style: disc;
    padding-left: 22px;
    margin: 0;
  }

  #stock-list li {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 6px;
  }

  @media (max-width: 480px) {
    #blox-stock {
      max-width: 100%;
      padding: 18px;
    }

    .stock-tabs button {
      font-size: 15px;
    }

    #stock-list li {
      font-size: 15px;
    }
  }
</style>
</head>

<body>

<div id="blox-stock">
  <div class="stock-tabs">
    <button id="tab-normal" class="active">Normal</button>
    <button id="tab-mirage">Mirage</button>
  </div>

  <div id="stock-timer">Loading…</div>
  <ul id="stock-list"></ul>
</div>
